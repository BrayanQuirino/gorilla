<!doctype html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="color-scheme" content="dark">
 <title>Gorilla · Arena ancestral 3D</title>
 <style>
 *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#38362e;color:#fff4d9;font:14px system-ui,sans-serif}
 #stage{position:relative;width:100vw;height:100dvh;overflow:hidden}
 canvas{display:block;width:100%;height:100%;touch-action:none;outline:none;cursor:grab}
 canvas:active{cursor:grabbing}
 .title{position:absolute;top:14px;left:16px;z-index:2;pointer-events:none;padding:9px 13px;background:#162824d9;border:1px solid #8b958880;border-radius:5px;font-weight:700;letter-spacing:.1em}
 .help{position:absolute;right:15px;bottom:14px;z-index:2;padding:9px 13px;background:#162824df;border:1px solid #8b958880;border-radius:5px}
 .help a{color:#f7de9b}
 #error{display:none;position:absolute;z-index:4;top:72px;left:16px;right:16px;max-width:760px;padding:15px;background:#4b2b25;color:#fff4e3;border:1px solid #efb59e;border-radius:5px}
 #loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;color:#f5eccd;font-size:16px}
 </style>
 <!-- The Babylon engine is used only in this independent environment viewer. -->
 <script defer src="https://cdn.babylonjs.com/babylon.js"></script>
 <script defer src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
 <main id="stage">
  <canvas id="arena-canvas" aria-label="Arena 3D de piedra con pirámides antiguas"></canvas>
  <div class="title">ARENA ANCESTRAL · PIRÁMIDES Y RUINAS</div>
  <div class="help">Arrastra para girar · Rueda para zoom · Doble clic para centrar · <a href="./?combate=1">Volver al combate</a></div>
  <div id="loading" role="status">Preparando arena 3D…</div>
  <div id="error" role="alert"></div>
 </main>
 <script type="module" src="./src/arena-preview.js"></script>
</body>
</html>
