name: Publish Gorilla to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gorilla-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Install FFmpeg for audio clipping
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Prepare approved recorded music and sound effects
        run: |
          python3 scripts/fetch-audio.py
          cat public/audio/status.json
      - name: Build for Pages
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Allow GitHub Pages artifact to become available
        run: sleep 18
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
